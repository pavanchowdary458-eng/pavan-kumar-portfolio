<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>{% block title %}Admin{% endblock %} | Portfolio</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head>
<body class="admin">
<header class="admin-bar">
  <a class="brand" href="{{ url_for('home') }}">P<span>.</span>K <small>admin</small></a>
  {% if session.is_admin %}
  <div><a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
  <form method="POST" action="{{ url_for('admin_logout') }}" class="inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="link">Log out</button></form></div>
  {% endif %}
</header>
<main class="admin-main">
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, text in msgs %}<div class="notice {{ cat }}">{{ text }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main></body></html>
